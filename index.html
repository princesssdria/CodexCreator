<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Vitality RPG</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Student Vitality RPG</h1>
        <p class="subtitle">Start each day with 100 Brightness Points and level up your habits.</p>
      </header>

      <section class="score-panel" aria-live="polite">
        <div class="score-row">
          <span class="label">Brightness Points</span>
          <span id="scoreValue" class="score-value">100</span>
        </div>
        <div class="progress-shell" role="progressbar" aria-valuemin="0" aria-valuemax="150" aria-valuenow="100" aria-label="Brightness points progress">
          <div id="progressBar" class="progress-fill"></div>
        </div>
      </section>

      <section class="grid">
        <div class="card">
          <h2>Daily Habit Log</h2>
          <p>Check completed habits to gain points.</p>
          <form id="habitForm" class="checklist"></form>
        </div>

        <div class="card">
          <h2>Debuffs</h2>
          <p>Check any debuffs that happened today.</p>
          <form id="debuffForm" class="checklist"></form>
        </div>
      </section>

      <section class="card status-card">
        <h2>Character Status</h2>
        <button id="statusButton" type="button">Generate End-of-Day Status</button>
        <p id="statusMessage" class="status-message">Your status will appear here after evaluation.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
